<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tchadok Admin - Multi-Theme & Adaptive Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* =========================================
           1. SYSTÈME DE THÈMES (COULEURS)
           ========================================= */
        
        /* --- THÈME CLAIR (Par défaut) --- */
        :root {
            --bg-body: #F1F5F9;
            --header-bg: #FFFFFF;
            --text-main: #1A202C;
            --text-muted: #718096;
            --border-color: #EDF2F7;
            
            --logo-bg: #005BB5;
            --logo-icon: #FFFFFF;
            
            --module-bg: #FFFFFF;
            --module-hover-border: #005BB5;
            --module-hover-shadow: rgba(0,0,0,0.05);
            
            --footer-bg: #F8FAFC;
            --nav-btn-bg: transparent;
            --nav-btn-active-bg: #FFFFFF;
            --nav-btn-active-txt: #005BB5;
            
            /* Stats Colors (Light) */
            --stat-user-bg: #EBF4FF; --stat-user-txt: #005BB5;
            --stat-stream-bg: #F0FFF4; --stat-stream-txt: #2D6A4F;
            --stat-rev-bg: #FFFBEB; --stat-rev-txt: #D97706; --stat-rev-border: rgba(255, 193, 7, 0.3);
            
            --theme-btn-bg: #E2E8F0;
            --theme-btn-txt: #4A5568;
        }

        /* --- THÈME SOMBRE --- */
        [data-theme="dark"] {
            --bg-body: #0F172A; /* Slate 900 */
            --header-bg: #1E293B; /* Slate 800 */
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155; /* Slate 700 */
            
            --logo-bg: #005BB5;
            --logo-icon: #FFFFFF;
            
            --module-bg: #0F172A;
            --module-hover-border: #38BDF8; /* Light Blue */
            --module-hover-shadow: rgba(0,0,0,0.3);
            
            --footer-bg: #0F172A;
            --nav-btn-bg: transparent;
            --nav-btn-active-bg: #1E293B;
            --nav-btn-active-txt: #38BDF8;
            
            /* Stats Colors (Dark) */
            --stat-user-bg: rgba(56, 189, 248, 0.1); --stat-user-txt: #38BDF8;
            --stat-stream-bg: rgba(52, 211, 153, 0.1); --stat-stream-txt: #34D399;
            --stat-rev-bg: rgba(251, 191, 36, 0.1); --stat-rev-txt: #FBBF24; --stat-rev-border: rgba(251, 191, 36, 0.2);
            
            --theme-btn-bg: #334155;
            --theme-btn-txt: #F8FAFC;
        }

        /* =========================================
           2. STYLES GLOBAUX & TRANSITIONS
           ========================================= */
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-top: 350px; /* Espace pour le header */
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- HEADER CONTAINER --- */
        .tchadok-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--header-bg);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.4s ease, border-color 0.4s ease, padding 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .header-content-wrapper {
            padding: 0 40px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- TOP BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.4s ease, padding 0.4s ease;
        }

        .brand-section { display: flex; align-items: center; gap: 15px; }
        .brand-logo {
            width: 48px; height: 48px;
            background: var(--logo-bg); color: var(--logo-icon);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            transition: all 0.4s ease;
        }
        .brand-text h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin: 0; font-weight: 700; transition: color 0.4s ease; }
        .brand-text p { font-size: 18px; color: var(--text-main); margin: 0; font-weight: 700; transition: color 0.4s ease; }

        /* Actions (Stats + Theme Toggle) */
        .actions-group { display: flex; align-items: center; gap: 15px; }
        
        .stat-tag {
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 8px; transition: all 0.4s ease;
        }
        .tag-users { background: var(--stat-user-bg); color: var(--stat-user-txt); }
        .tag-streams { background: var(--stat-stream-bg); color: var(--stat-stream-txt); }
        .tag-revenue { background: var(--stat-rev-bg); color: var(--stat-rev-txt); border: 1px solid var(--stat-rev-border); }

        .theme-toggle-btn {
            background: var(--theme-btn-bg);
            color: var(--theme-btn-txt);
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        .theme-toggle-btn:hover { transform: rotate(15deg) scale(1.1); }

        /* --- MODULE GRID --- */
        .module-grid-container {
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, padding 0.4s ease;
            max-height: 500px; opacity: 1; padding: 25px 0;
        }
        
        .module-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .module-card {
            background: var(--module-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex; align-items: center; gap: 15px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
        }
        .module-card:hover { border-color: var(--module-hover-border); box-shadow: 0 4px 12px var(--module-hover-shadow); transform: translateY(-3px); color: var(--module-hover-border); }
        
        .icon-box {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
        }

        /* --- FOOTER / NAV --- */
        .admin-footer { background: var(--footer-bg); transition: background-color 0.4s ease; }
        .admin-footer-inner { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .nav-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); transition: color 0.4s ease; }
        .nav-pill-custom { display: flex; gap: 10px; align-items: center; }
        
        .nav-link-item {
            padding: 8px 20px; border-radius: 20px;
            color: var(--text-muted); background: var(--nav-btn-bg); border: 1px solid transparent;
            text-decoration: none; font-weight: 600; font-size: 13px;
            transition: all 0.3s ease; display: flex; align-items: center;
        }
        .nav-link-item:hover { color: var(--text-main); }
        .nav-link-item.active {
            background: var(--nav-btn-active-bg); color: var(--nav-btn-active-txt);
            border-color: var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* =========================================
           3. ÉTAT COMPACT (DÉCLENCHÉ AU SCROLL)
           ========================================= */
        .compact-layout .top-bar { padding: 10px 0; border-bottom-color: transparent; }
        .compact-layout .brand-logo { width: 36px; height: 36px; font-size: 18px; }
        .compact-layout .brand-text p { font-size: 16px; }
        .compact-layout .module-grid-container { max-height: 0; opacity: 0; padding: 0; pointer-events: none; }
        .compact-layout .admin-footer { border-top: 1px solid var(--border-color); }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) { .module-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .top-bar, .admin-footer-inner { flex-direction: column; gap: 15px; }
            .actions-group { flex-wrap: wrap; justify-content: center; }
            .module-grid { grid-template-columns: 1fr; }
            body { padding-top: 500px; }
        }
    </style>
</head>
<body>

<header class="tchadok-header" id="mainHeader">
    <div class="header-content-wrapper">
        
        <div class="top-bar">
            <div class="brand-section">
                <div class="brand-logo"><i class="bi bi-shield-check"></i></div>
                <div class="brand-text">
                    <h1>Tchadok Control Center</h1>
                    <p>Admin Tchadok</p>
                </div>
            </div>
            
            <div class="actions-group">
                <div class="stat-tag tag-users"><i class="bi bi-people-fill"></i> 10 utilisateurs</div>
                <div class="stat-tag tag-streams"><i class="bi bi-play-circle-fill"></i> 0 streams (30j)</div>
                <div class="stat-tag tag-revenue"><i class="bi bi-wallet2"></i> 0 XAF</div>
                
                <button id="themeToggle" class="theme-toggle-btn" title="Basculer le thème">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
            </div>
        </div>

        <div class="module-grid-container">
            <div class="module-grid">
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(0, 91, 181, 0.1); color: #005BB5;"><i class="bi bi-person-gear"></i></div>
                    <span class="fw-semibold">Gouvernance utilisateurs</span>
                </a>
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(45, 106, 79, 0.1); color: #2D6A4F;"><i class="bi bi-music-note-list"></i></div>
                    <span class="fw-semibold">Catalogue titres</span>
                </a>
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(217, 119, 6, 0.1); color: #D97706;"><i class="bi bi-broadcast"></i></div>
                    <span class="fw-semibold">Régie radio</span>
                </a>
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(49, 130, 206, 0.1); color: #3182CE;"><i class="bi bi-pencil-square"></i></div>
                    <span class="fw-semibold">Studio éditorial</span>
                </a>
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(230, 57, 70, 0.1); color: #E63946;"><i class="bi bi-collection-play"></i></div>
                    <span class="fw-semibold">Curation playlists</span>
                </a>
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(156, 39, 176, 0.1); color: #9C27B0;"><i class="bi bi-mic"></i></div>
                    <span class="fw-semibold">Studio podcasts</span>
                </a>
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(0, 137, 123, 0.1); color: #00897B;"><i class="bi bi-disc"></i></div>
                    <span class="fw-semibold">Catalogue albums</span>
                </a>
                <a href="#" class="module-card">
                    <div class="icon-box" style="background: rgba(113, 128, 150, 0.1); color: #718096;"><i class="bi bi-tools"></i></div>
                    <span class="fw-semibold">Maintenance</span>
                </a>
            </div>
        </div>

    </div>

    <div class="admin-footer">
        <div class="header-content-wrapper admin-footer-inner">
            <div class="nav-label">Parcours Admin</div>
            <nav class="nav-pill-custom">
                <a href="#" class="nav-link-item"><i class="bi bi-house-door me-2"></i> Console</a>
                <a href="#" class="nav-link-item"><i class="bi bi-grid me-2"></i> Modules</a>
                <a href="#" class="nav-link-item"><i class="bi bi-graph-up me-2"></i> KPIs</a>
                <a href="#" class="nav-link-item active"><i class="bi bi-people me-2"></i> Utilisateurs</a>
            </nav>
        </div>
    </div>
</header>

<main class="container" style="margin-top: 50px;">
    <div style="height: 1500px; padding: 50px; border-radius: 12px; border: 1px dashed var(--border-color); text-align: center;">
        </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function() {
        /* =========================================
           GESTION DU LAYOUT (COMPACT AU SCROLL)
           ========================================= */
        $(window).scroll(function() {
            if ($(this).scrollTop() > 60) {
                $('#mainHeader').addClass('compact-layout');
            } else {
                $('#mainHeader').removeClass('compact-layout');
            }
        });

        /* =========================================
           GESTION DU THÈME (CLAIR / SOMBRE)
           ========================================= */
        const themeToggleBtn = $('#themeToggle');
        const themeIcon = themeToggleBtn.find('i');
        const htmlElement = $('html');

        // Vérifier si un thème est déjà sauvegardé dans le navigateur
        const savedTheme = localStorage.getItem('tchadok_theme') || 'light';
        setTheme(savedTheme);

        // Action au clic sur le bouton
        themeToggleBtn.on('click', function() {
            const currentTheme = htmlElement.attr('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        });

        // Fonction pour appliquer le thème
        function setTheme(theme) {
            htmlElement.attr('data-theme', theme);
            localStorage.setItem('tchadok_theme', theme);
            
            if (theme === 'dark') {
                themeIcon.removeClass('bi-moon-stars-fill').addClass('bi-sun-fill');
            } else {
                themeIcon.removeClass('bi-sun-fill').addClass('bi-moon-stars-fill');
            }
        }

        /* =========================================
           GESTION DES BOUTONS DE NAVIGATION
           ========================================= */
        $('.nav-link-item').on('click', function(e) {
            e.preventDefault();
            $('.nav-link-item').removeClass('active');
            $(this).addClass('active');
        });
    });
</script>

</body>
</html>
