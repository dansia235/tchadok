<VirtualHost *:80>
    ServerName radio.tchadok.td
    Redirect permanent / https://radio.tchadok.td/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName radio.tchadok.td

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/radio.tchadok.td/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/radio.tchadok.td/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Icecast public stream + status
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/radio-error.log
    CustomLog ${APACHE_LOG_DIR}/radio-access.log combined
</VirtualHost>
</IfModule>

